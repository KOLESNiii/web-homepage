    <!-- Pick the ground before first paint, so the page never flashes the
         wrong map at you. Mirrors composables/useTheme.ts. -->
    <script>
      try {
        var stored = localStorage.getItem('portfolio-theme') || localStorage.getItem('tube-theme')
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
